version: 2

models:
  - name: dim_clientes
    description: "Dimensao final de clientes para consumo analitico. Consolida dados cadastrais, status, canal preferido e informacoes de endereco."
    columns:
      - name: cliente_id
        description: "Identificador unico do cliente."
        data_tests:
          - unique
          - not_null
      - name: nome_cliente
        description: "Nome do cliente apos limpeza de espacos e padronizacao basica."
      - name: email
        description: "Endereco de e-mail do cliente em minusculas."
        data_tests:
          - unique
          - not_null
      - name: dt_cadastro
        description: "Data de cadastro do cliente."
        data_tests:
          - not_null
      - name: mes_cadastro
        description: "Primeiro dia do mes de cadastro, util para agregacoes mensais."
      - name: ano_cadastro
        description: "Ano de cadastro do cliente."
      - name: status_cliente
        description: "Status padronizado do cliente."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ativo', 'inativo']
      - name: is_cliente_ativo
        description: "Indicador booleano para clientes com status ativo."
      - name: segmento
        description: "Segmento padronizado do cliente."
        data_tests:
          - accepted_values:
              arguments:
                values: ['pf', 'b2b']
      - name: canal_preferido
        description: "Canal preferido informado pelo cliente."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['site', 'app', 'marketplace']
      - name: score_fidelidade
        description: "Pontuacao de fidelidade do cliente."
      - name: faixa_score_fidelidade
        description: "Classificacao derivada do score de fidelidade em alta, media ou baixa."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['alta', 'media', 'baixa']
      - name: endereco_id
        description: "Identificador do endereco principal do cliente."
      - name: uf_cadastro
        description: "UF do endereco cadastral do cliente."
        data_tests:
          - not_null
      - name: cidade_cadastro
        description: "Cidade do endereco cadastral do cliente."
      - name: cep
        description: "CEP do endereco cadastral do cliente."
      - name: logradouro
        description: "Logradouro do endereco cadastral."
      - name: bairro
        description: "Bairro do endereco cadastral."
      - name: numero
        description: "Numero do endereco cadastral."
      - name: complemento
        description: "Complemento do endereco cadastral, quando informado."

  - name: dim_produtos
    description: "Dimensao final de produtos com contexto de categoria, estoque e faixas analiticas."
    columns:
      - name: produto_id
        description: "Identificador unico do produto."
        data_tests:
          - unique
          - not_null
      - name: nome_produto
        description: "Nome do produto apos limpeza e padronizacao de espacos."
      - name: status_produto
        description: "Status padronizado do produto."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ativo', 'inativo']
      - name: is_produto_ativo
        description: "Indicador booleano de produto ativo."
      - name: quantidade_estoque
        description: "Quantidade atual em estoque."
      - name: situacao_estoque
        description: "Classificacao derivada da quantidade de estoque."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sem_estoque', 'baixo_estoque', 'estoque_medio', 'estoque_alto']
      - name: preco_atual
        description: "Preco atual do produto."
        data_tests:
          - not_null
      - name: faixa_preco
        description: "Classificacao do produto por faixa de preco."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ate_99', '100_a_299', '300_a_599', '600_ou_mais']
      - name: categoria_id
        description: "Identificador da categoria associada ao produto."
        data_tests:
          - not_null
      - name: sigla_categoria
        description: "Sigla da categoria do produto."
      - name: nome_categoria
        description: "Nome descritivo da categoria do produto."
        data_tests:
          - not_null
      - name: marca
        description: "Marca do produto."
      - name: dt_cadastro
        description: "Data de cadastro do produto."
      - name: valor_estoque_atual
        description: "Valor financeiro do estoque atual, calculado como quantidade_estoque * preco_atual."

  - name: fact_vendas
    description: "Fato final de vendas no grao de item de pedido. Centraliza medidas de receita, desconto, produto, cliente, categoria, geografia e periodo."
    columns:
      - name: pedido_item_id
        description: "Chave unica do item de pedido, composta por pedido_id e item_seq."
        data_tests:
          - unique
          - not_null
      - name: pedido_id
        description: "Identificador do pedido."
        data_tests:
          - not_null
      - name: item_seq
        description: "Sequencia do item dentro do pedido."
      - name: dt_pedido
        description: "Data e hora do pedido."
        data_tests:
          - not_null
      - name: data_pedido
        description: "Data do pedido sem componente de hora."
      - name: mes_pedido
        description: "Primeiro dia do mes do pedido."
      - name: ano_pedido
        description: "Ano do pedido."
      - name: mes_numero_pedido
        description: "Numero do mes do pedido."
      - name: status_pedido
        description: "Status padronizado do pedido."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cancelado', 'concluido', 'em_separacao', 'em_transporte', 'entregue', 'faturado']
      - name: is_pedido_cancelado
        description: "Indicador booleano de pedido cancelado."
      - name: forma_pagamento
        description: "Forma de pagamento padronizada."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['boleto', 'cartao_credito', 'cartao_debito', 'pix']
      - name: canal_venda
        description: "Canal de venda padronizado."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['site', 'app', 'marketplace']
      - name: cupom_codigo
        description: "Codigo do cupom aplicado ao pedido, quando existente."
      - name: cliente_id
        description: "Identificador do cliente associado ao pedido."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: cliente_id
      - name: nome_cliente
        description: "Nome do cliente no momento da consulta analitica."
      - name: status_cliente
        description: "Status atual do cliente."
      - name: segmento_cliente
        description: "Segmento do cliente."
      - name: faixa_score_fidelidade
        description: "Faixa de fidelidade do cliente."
      - name: uf_cadastro
        description: "UF do endereco cadastral do cliente."
      - name: cidade_cadastro
        description: "Cidade do endereco cadastral do cliente."
      - name: uf_entrega
        description: "UF de entrega registrada no pedido."
      - name: cidade_entrega
        description: "Cidade de entrega registrada no pedido."
      - name: produto_id
        description: "Identificador do produto vendido."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produtos')
                field: produto_id
      - name: nome_produto
        description: "Nome do produto vendido."
      - name: status_produto
        description: "Status atual do produto."
      - name: marca
        description: "Marca do produto."
      - name: categoria_id
        description: "Identificador da categoria do produto."
      - name: sigla_categoria
        description: "Sigla da categoria do produto."
      - name: nome_categoria
        description: "Nome da categoria do produto."
      - name: quantidade
        description: "Quantidade original registrada no item do pedido."
        data_tests:
          - not_null
      - name: quantidade_vendida
        description: "Quantidade considerada para venda liquida; pedidos cancelados sao zerados."
        data_tests:
          - not_null
      - name: preco_unitario
        description: "Preco unitario bruto praticado no item."
        data_tests:
          - not_null
      - name: preco_unitario_liquido
        description: "Preco unitario liquido do item, calculado a partir do subtotal."
      - name: valor_bruto_item
        description: "Valor bruto do item antes dos descontos."
        data_tests:
          - not_null
      - name: valor_desconto_item
        description: "Valor de desconto aplicado ao item."
        data_tests:
          - not_null
      - name: valor_liquido_item
        description: "Valor liquido do item apos descontos."
        data_tests:
          - not_null
      - name: receita_liquida_item
        description: "Receita liquida considerada para analise; pedidos cancelados sao zerados."
        data_tests:
          - not_null

  - name: agg_vendas_por_estado
    description: "Agregacao analitica de vendas por UF, com faturamento, volume e ranking de desempenho."
    columns:
      - name: uf
        description: "UF utilizada para a analise de vendas, priorizando a UF de entrega."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['SP', 'RJ', 'MG', 'PR', 'RS', 'BA', 'PE', 'SC', 'GO', 'CE']
      - name: ranking_faturamento
        description: "Posicao da UF no ranking de faturamento."
        data_tests:
          - not_null
      - name: ranking_quantidade
        description: "Posicao da UF no ranking de quantidade vendida."
        data_tests:
          - not_null
      - name: pedidos_totais
        description: "Quantidade total de pedidos associados a UF, incluindo pedidos cancelados."
        data_tests:
          - not_null
      - name: pedidos_faturados
        description: "Quantidade de pedidos com receita positiva na UF."
        data_tests:
          - not_null
      - name: clientes_com_compra
        description: "Quantidade de clientes distintos com compra faturada na UF."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida na UF, ja considerando zeragem de pedidos cancelados."
        data_tests:
          - not_null
      - name: faturamento_total
        description: "Receita liquida total da UF."
        data_tests:
          - not_null
      - name: ticket_medio_pedido
        description: "Faturamento medio por pedido faturado na UF."
        data_tests:
          - not_null

  - name: agg_vendas_por_categoria
    description: "Agregacao analitica de vendas por categoria, com rankings por quantidade e faturamento."
    columns:
      - name: categoria_id
        description: "Identificador da categoria agregada."
        data_tests:
          - unique
          - not_null
      - name: sigla_categoria
        description: "Sigla da categoria."
        data_tests:
          - not_null
      - name: nome_categoria
        description: "Nome da categoria."
        data_tests:
          - not_null
      - name: ranking_quantidade
        description: "Posicao da categoria no ranking por quantidade vendida."
        data_tests:
          - not_null
      - name: ranking_faturamento
        description: "Posicao da categoria no ranking por faturamento."
        data_tests:
          - not_null
      - name: pedidos_com_categoria
        description: "Quantidade de pedidos com pelo menos um item da categoria."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida da categoria."
        data_tests:
          - not_null
      - name: faturamento_total
        description: "Receita liquida total da categoria."
        data_tests:
          - not_null
      - name: ticket_medio_pedido
        description: "Receita media por pedido com a categoria."
        data_tests:
          - not_null

  - name: agg_vendas_mensal
    description: "Agregacao mensal de vendas faturadas, com receita, volume, quantidade de pedidos e ranking de meses."
    columns:
      - name: mes_pedido
        description: "Primeiro dia do mes de referencia."
        data_tests:
          - unique
          - not_null
      - name: ano_pedido
        description: "Ano da competencia mensal."
        data_tests:
          - not_null
      - name: mes_numero_pedido
        description: "Numero do mes da competencia."
        data_tests:
          - not_null
      - name: ranking_receita
        description: "Posicao do mes no ranking de receita."
        data_tests:
          - not_null
      - name: pedidos_faturados
        description: "Quantidade de pedidos faturados no mes."
        data_tests:
          - not_null
      - name: clientes_com_compra
        description: "Quantidade de clientes distintos com compra no mes."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida no mes."
        data_tests:
          - not_null
      - name: receita_total
        description: "Receita liquida total do mes."
        data_tests:
          - not_null
      - name: ticket_medio_mensal
        description: "Ticket medio dos pedidos faturados no mes."
        data_tests:
          - not_null

  - name: agg_clientes_por_segmento
    description: "Agregacao de clientes por segmento, combinando base cadastral, fidelidade e comportamento de compra."
    columns:
      - name: segmento
        description: "Segmento analitico do cliente, incluindo nao_informado quando o cadastro nao traz segmento."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['pf', 'b2b', 'nao_informado']
      - name: ranking_receita
        description: "Posicao do segmento no ranking de receita."
        data_tests:
          - not_null
      - name: total_clientes
        description: "Quantidade total de clientes do segmento."
        data_tests:
          - not_null
      - name: clientes_ativos
        description: "Quantidade de clientes ativos no segmento."
        data_tests:
          - not_null
      - name: clientes_inativos
        description: "Quantidade de clientes inativos no segmento."
        data_tests:
          - not_null
      - name: clientes_com_compra
        description: "Quantidade de clientes do segmento com pelo menos um pedido faturado."
        data_tests:
          - not_null
      - name: clientes_sem_compra
        description: "Quantidade de clientes do segmento sem pedidos faturados."
        data_tests:
          - not_null
      - name: clientes_score_alta
        description: "Quantidade de clientes com faixa de score alta."
        data_tests:
          - not_null
      - name: clientes_score_media
        description: "Quantidade de clientes com faixa de score media."
        data_tests:
          - not_null
      - name: clientes_score_baixa
        description: "Quantidade de clientes com faixa de score baixa."
        data_tests:
          - not_null
      - name: pedidos_faturados
        description: "Quantidade total de pedidos faturados do segmento."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida para o segmento."
        data_tests:
          - not_null
      - name: receita_total
        description: "Receita liquida total do segmento."
        data_tests:
          - not_null
      - name: score_medio_fidelidade
        description: "Score medio de fidelidade dos clientes do segmento."
        data_tests:
          - not_null
      - name: ticket_medio_pedido
        description: "Receita media por pedido faturado do segmento."
      - name: receita_media_por_cliente_com_compra
        description: "Receita media por cliente comprador do segmento."

  - name: agg_vendas_por_produto
    description: "Agregacao analitica de vendas por produto, com rankings por quantidade e faturamento."
    columns:
      - name: produto_id
        description: "Identificador unico do produto agregado."
        data_tests:
          - unique
          - not_null
      - name: ranking_quantidade
        description: "Posicao do produto no ranking de quantidade vendida."
        data_tests:
          - not_null
      - name: ranking_faturamento
        description: "Posicao do produto no ranking de faturamento."
        data_tests:
          - not_null
      - name: nome_produto
        description: "Nome do produto."
        data_tests:
          - not_null
      - name: nome_categoria
        description: "Categoria do produto."
        data_tests:
          - not_null
      - name: marca
        description: "Marca do produto."
      - name: faixa_preco
        description: "Faixa de preco do produto."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ate_99', '100_a_299', '300_a_599', '600_ou_mais']
      - name: status_produto
        description: "Status atual do produto."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ativo', 'inativo']
      - name: pedidos_com_produto
        description: "Quantidade de pedidos com o produto."
        data_tests:
          - not_null
      - name: clientes_com_compra
        description: "Quantidade de clientes distintos que compraram o produto."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida do produto."
        data_tests:
          - not_null
      - name: faturamento_total
        description: "Receita liquida total do produto."
        data_tests:
          - not_null
      - name: ticket_medio_pedido
        description: "Receita media por pedido com o produto."
        data_tests:
          - not_null

  - name: agg_vendas_por_canal
    description: "Agregacao de desempenho por canal de venda, com receita, volume e taxa de cancelamento."
    columns:
      - name: canal_venda
        description: "Canal de venda agregado."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['site', 'app', 'marketplace']
      - name: ranking_faturamento
        description: "Posicao do canal no ranking de faturamento."
        data_tests:
          - not_null
      - name: ranking_quantidade
        description: "Posicao do canal no ranking de quantidade vendida."
        data_tests:
          - not_null
      - name: pedidos_totais
        description: "Quantidade total de pedidos no canal."
        data_tests:
          - not_null
      - name: pedidos_faturados
        description: "Quantidade de pedidos faturados no canal."
        data_tests:
          - not_null
      - name: pedidos_cancelados
        description: "Quantidade de pedidos cancelados no canal."
        data_tests:
          - not_null
      - name: clientes_com_compra
        description: "Quantidade de clientes distintos com compra faturada no canal."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida no canal."
        data_tests:
          - not_null
      - name: faturamento_total
        description: "Receita liquida total do canal."
        data_tests:
          - not_null
      - name: ticket_medio_pedido
        description: "Receita media por pedido faturado no canal."
        data_tests:
          - not_null
      - name: percentual_cancelamento
        description: "Proporcao de pedidos cancelados dentro do canal."
        data_tests:
          - not_null

  - name: agg_vendas_por_forma_pagamento
    description: "Agregacao de desempenho por forma de pagamento, com receita, volume e taxa de cancelamento."
    columns:
      - name: forma_pagamento
        description: "Forma de pagamento agregada."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['boleto', 'cartao_credito', 'cartao_debito', 'pix']
      - name: ranking_faturamento
        description: "Posicao da forma de pagamento no ranking de faturamento."
        data_tests:
          - not_null
      - name: ranking_quantidade
        description: "Posicao da forma de pagamento no ranking de quantidade vendida."
        data_tests:
          - not_null
      - name: pedidos_totais
        description: "Quantidade total de pedidos nessa forma de pagamento."
        data_tests:
          - not_null
      - name: pedidos_faturados
        description: "Quantidade de pedidos faturados nessa forma de pagamento."
        data_tests:
          - not_null
      - name: pedidos_cancelados
        description: "Quantidade de pedidos cancelados nessa forma de pagamento."
        data_tests:
          - not_null
      - name: clientes_com_compra
        description: "Quantidade de clientes distintos com compra faturada nessa forma de pagamento."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida nessa forma de pagamento."
        data_tests:
          - not_null
      - name: faturamento_total
        description: "Receita liquida total dessa forma de pagamento."
        data_tests:
          - not_null
      - name: ticket_medio_pedido
        description: "Receita media por pedido faturado nessa forma de pagamento."
        data_tests:
          - not_null
      - name: percentual_cancelamento
        description: "Proporcao de cancelamento por forma de pagamento."
        data_tests:
          - not_null

  - name: agg_pedidos_por_status
    description: "Agregacao de pedidos por status, com distribuicao, receita e ranking."
    columns:
      - name: status_pedido
        description: "Status agregado do pedido."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['cancelado', 'concluido', 'em_separacao', 'em_transporte', 'entregue', 'faturado']
      - name: ranking_quantidade_pedidos
        description: "Posicao do status no ranking por quantidade de pedidos."
        data_tests:
          - not_null
      - name: ranking_receita
        description: "Posicao do status no ranking por receita."
        data_tests:
          - not_null
      - name: quantidade_pedidos
        description: "Quantidade de pedidos no status."
        data_tests:
          - not_null
      - name: clientes_distintos
        description: "Quantidade de clientes distintos associados ao status."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida associada ao status."
        data_tests:
          - not_null
      - name: receita_total
        description: "Receita liquida total associada ao status."
        data_tests:
          - not_null
      - name: ticket_medio_pedido
        description: "Receita media por pedido no status."
        data_tests:
          - not_null
      - name: percentual_pedidos
        description: "Participacao do status sobre o total de pedidos."
        data_tests:
          - not_null

  - name: agg_clientes_por_uf
    description: "Agregacao de clientes por UF de cadastro, combinando base cadastral e comportamento de compra."
    columns:
      - name: uf_cadastro
        description: "UF de cadastro agregada."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['SP', 'RJ', 'MG', 'PR', 'RS', 'BA', 'PE', 'SC', 'GO', 'CE']
      - name: ranking_receita
        description: "Posicao da UF no ranking de receita."
        data_tests:
          - not_null
      - name: total_clientes
        description: "Quantidade total de clientes da UF."
        data_tests:
          - not_null
      - name: clientes_ativos
        description: "Quantidade de clientes ativos da UF."
        data_tests:
          - not_null
      - name: clientes_inativos
        description: "Quantidade de clientes inativos da UF."
        data_tests:
          - not_null
      - name: clientes_com_compra
        description: "Quantidade de clientes da UF com pelo menos um pedido faturado."
        data_tests:
          - not_null
      - name: clientes_sem_compra
        description: "Quantidade de clientes da UF sem pedidos faturados."
        data_tests:
          - not_null
      - name: pedidos_faturados
        description: "Quantidade total de pedidos faturados da UF."
        data_tests:
          - not_null
      - name: quantidade_total_vendida
        description: "Quantidade total vendida para clientes da UF."
        data_tests:
          - not_null
      - name: receita_total
        description: "Receita liquida total da UF."
        data_tests:
          - not_null
      - name: score_medio_fidelidade
        description: "Score medio de fidelidade dos clientes da UF."
        data_tests:
          - not_null
